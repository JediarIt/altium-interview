name: CI

# Builds the solution and runs the tests with code coverage. It starts only when code changes: a commit that touches
# only documentation or the OpenSpec artifacts does not start it. The whole solution is built and tested at once,
# because one test project covers every program and the coverage is counted over all of them.
on:
  push:
    branches: [main]
    paths:
      - 'FileSort.*/**'
      - 'FileSort.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      # Documentation inside the project folders is not code...
      - '!FileSort.*/**/*.md'
      # ...except the README whose options table a test compares with the command line.
      - 'FileSort.Generator/README.md'
  pull_request:
    paths:
      - 'FileSort.*/**'
      - 'FileSort.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - '!FileSort.*/**/*.md'
      - 'FileSort.Generator/README.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch makes the run of an older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FileSort.slnx

      # Warnings are errors in this solution, and the SDK setup registers a problem matcher, so a compiler message
      # shows up as an annotation on the changed line.
      - name: Build
        run: dotnet build FileSort.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test --solution FileSort.slnx -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --report-xunit-markdown --report-xunit-markdown-filename tests.md
          --report-xunit-junit --report-xunit-junit-filename tests.junit.xml

      # The summaries go to the page of the run. They are written after a failed test run too.
      - name: Test summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path TestResults/tests.md) {
            Get-Content TestResults/tests.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } else {
            '### Test Results' , '', 'The tests did not produce a report.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      # Fails the run when the line coverage of the solution is below 80%.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: ./.github/scripts/coverage-summary.ps1 -Report TestResults/coverage.cobertura.xml -Threshold 80

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
