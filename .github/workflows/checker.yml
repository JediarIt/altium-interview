name: Checker

# Builds the solution and runs the tests of the checker with code coverage. It starts when something changes that
# can affect the checker or its tests: its code, the console library, the tests, the build files, and also the
# generator, because the tests of the checker make their inputs with it. A commit that touches only documentation
# or the OpenSpec artifacts does not start it.
on:
  push:
    branches: [main]
    paths:
      - 'FileSort.Checker/**'
      - 'FileSort.Cli/**'
      - 'FileSort.Generator/**'
      - 'FileSort.Common/**'
      - 'FileSort.Benchmarks/**'
      - 'FileSort.Tests/**'
      # The solution builds the sorter too, and warnings are errors in it. It gets a workflow of its own later.
      - 'FileSort.Sorter/**'
      - 'FileSort.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/workflows/test-program.yml'
      - '.github/workflows/checker.yml'
      - '.github/scripts/**'
      # Documentation inside the project folders is not code...
      - '!FileSort.*/**/*.md'
      # ...except the README whose options table a test compares with the command line.
      - 'FileSort.Checker/README.md'
  pull_request:
    paths:
      - 'FileSort.Checker/**'
      - 'FileSort.Cli/**'
      - 'FileSort.Generator/**'
      - 'FileSort.Common/**'
      - 'FileSort.Benchmarks/**'
      - 'FileSort.Tests/**'
      # The solution builds the sorter too, and warnings are errors in it. It gets a workflow of its own later.
      - 'FileSort.Sorter/**'
      - 'FileSort.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/workflows/test-program.yml'
      - '.github/workflows/checker.yml'
      - '.github/scripts/**'
      # Documentation inside the project folders is not code...
      - '!FileSort.*/**/*.md'
      # ...except the README whose options table a test compares with the command line.
      - 'FileSort.Checker/README.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch makes the run of an older one pointless.
concurrency:
  group: checker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-program.yml
    with:
      program: checker
      # The checker, the naive parser and sort that its tests rely on, the console library.
      namespaces: FileSort.Tests.Checker* FileSort.Tests.Format* FileSort.Tests.Cli*
      assemblies: FileSort.Checker,FileSort.Cli
