name: Publish the generator

# Builds the generator as one self-contained executable that runs without .NET installed. Started by hand: the
# "Run workflow" button on the Actions page, with the target platform as its input. The executable is attached to
# the run as an artifact.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Target platform
        type: choice
        default: win-x64
        options:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

permissions:
  contents: read

jobs:
  generator:
    name: FileSort.Generator for ${{ inputs.runtime }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A self-contained single file is not NativeAOT, so any machine publishes for any platform.
      - name: Publish
        run: dotnet publish FileSort.Generator -c Release -r ${{ inputs.runtime }} -o publish/generator

      # The published executable must write the same bytes as the regular build. It can be run only when the target
      # platform is the platform of this runner.
      - name: Compare with the regular build
        if: ${{ inputs.runtime == 'win-x64' }}
        shell: pwsh
        run: |
          dotnet run -c Release --project FileSort.Generator -- --output data/regular.txt --size 1MB --seed 1
          ./publish/generator/FileSort.Generator.exe --output data/published.txt --size 1MB --seed 1
          $regular = (Get-FileHash data/regular.txt -Algorithm SHA256).Hash
          $published = (Get-FileHash data/published.txt -Algorithm SHA256).Hash
          "Regular build:        $regular"
          "Published executable: $published"
          if ($regular -ne $published) {
            '::error title=Publish::The published executable and the regular build wrote different bytes.'
            exit 1
          }
          "### FileSort.Generator for ${{ inputs.runtime }}", '', "SHA-256 of the 1 MB reference file: ``$published``" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: FileSort.Generator-${{ inputs.runtime }}
          path: publish/generator/
          if-no-files-found: error
