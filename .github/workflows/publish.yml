name: Publish a program

# Builds the generator or the checker as one self-contained executable that runs without .NET installed. Started by
# hand: the "Run workflow" button on the Actions page, with the program and the target platform as its inputs. The
# executable is attached to the run as an artifact.
on:
  workflow_dispatch:
    inputs:
      program:
        description: Program
        type: choice
        default: generator
        options:
          - generator
          - checker
      runtime:
        description: Target platform
        type: choice
        default: win-x64
        options:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

permissions:
  contents: read

jobs:
  publish:
    name: FileSort ${{ inputs.program }} for ${{ inputs.runtime }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The project of the program and the name of its executable.
      PROJECT: ${{ inputs.program == 'checker' && 'FileSort.Checker' || 'FileSort.Generator' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A self-contained single file is not NativeAOT, so any machine publishes for any platform.
      - name: Publish
        shell: pwsh
        run: dotnet publish $env:PROJECT -c Release -r ${{ inputs.runtime }} -o publish/${{ inputs.program }}

      # The published generator must write the same bytes as the regular build. It can be run only when the target
      # platform is the platform of this runner.
      - name: Compare the generator with the regular build
        if: ${{ inputs.program == 'generator' && inputs.runtime == 'win-x64' }}
        shell: pwsh
        run: |
          dotnet run -c Release --project FileSort.Generator -- --output data/regular.txt --size 1MB --seed 1
          ./publish/generator/FileSort.Generator.exe --output data/published.txt --size 1MB --seed 1
          $regular = (Get-FileHash data/regular.txt -Algorithm SHA256).Hash
          $published = (Get-FileHash data/published.txt -Algorithm SHA256).Hash
          "Regular build:        $regular"
          "Published executable: $published"
          if ($regular -ne $published) {
            '::error title=Publish::The published executable and the regular build wrote different bytes.'
            exit 1
          }
          "### FileSort.Generator for ${{ inputs.runtime }}", '', "SHA-256 of the 1 MB reference file: ``$published``" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # The published checker must give the results of the regular build: exit code 0 for a correct pair and 4 for a
      # pair whose output has an order violation. The two pairs are written here, a few lines each.
      - name: Check a correct pair and a broken pair with the checker
        if: ${{ inputs.program == 'checker' && inputs.runtime == 'win-x64' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          [IO.File]::WriteAllText("$PWD/data/input.txt", "415. Apple`n30432. Something something something`n1. Apple`n32. Cherry is the best`n2. Banana is yellow`n")
          [IO.File]::WriteAllText("$PWD/data/correct.txt", "1. Apple`n415. Apple`n2. Banana is yellow`n32. Cherry is the best`n30432. Something something something`n")
          [IO.File]::WriteAllText("$PWD/data/broken.txt", "415. Apple`n1. Apple`n2. Banana is yellow`n32. Cherry is the best`n30432. Something something something`n")

          ./publish/checker/FileSort.Checker.exe --input data/input.txt --sorted data/correct.txt
          $correct = $LASTEXITCODE
          ./publish/checker/FileSort.Checker.exe --input data/input.txt --sorted data/broken.txt
          $broken = $LASTEXITCODE
          "Exit code for the correct pair: $correct (expected 0)"
          "Exit code for the broken pair:  $broken (expected 4)"
          if ($correct -ne 0 -or $broken -ne 4) {
            '::error title=Publish::The published checker did not give the exit codes 0 and 4.'
            exit 1
          }
          "### FileSort.Checker for ${{ inputs.runtime }}", '', 'A correct pair gave exit code 0, a pair with an order violation exit code 4.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit 0

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT }}-${{ inputs.runtime }}
          path: publish/${{ inputs.program }}/
          if-no-files-found: error
